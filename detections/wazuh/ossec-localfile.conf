<!--
  Merge into /var/ossec/etc/ossec.conf.

  Replace AIRCAP_REPO below with the absolute path to your clone, e.g.:
      sed -i "s|AIRCAP_REPO|$(pwd)|g" ossec-localfile.conf
  Wazuh does not expand environment variables or ~ in <location>, so the path
  must be literal and absolute.
-->
<ossec_config>

  <localfile>
    <log_format>json</log_format>
    <location>AIRCAP_REPO/data/agent-traces/*/*.jsonl</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>AIRCAP_REPO/data/bedrock-logs/AWSLogs/*/BedrockModelInvocationLogs/*/*/*/*/*/*.jsonl</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>AIRCAP_REPO/data/cloudtrail/AWSLogs/*/CloudTrail/*/*/*/*/*.jsonl</location>
  </localfile>

</ossec_config>
