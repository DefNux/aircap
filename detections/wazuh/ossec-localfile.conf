<!-- Merge into /var/ossec/etc/ossec.conf. Paths assume the repo at /mnt/HDD/Tools/aircap. -->
<ossec_config>

  <localfile>
    <log_format>json</log_format>
    <location>/mnt/HDD/Tools/aircap/data/agent-traces/*/*.jsonl</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/mnt/HDD/Tools/aircap/data/bedrock-logs/AWSLogs/*/BedrockModelInvocationLogs/*/*/*/*/*/*.jsonl</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/mnt/HDD/Tools/aircap/data/cloudtrail/AWSLogs/*/CloudTrail/*/*/*/*/*.jsonl</location>
  </localfile>

</ossec_config>
