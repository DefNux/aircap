title: Credential material in a user-facing response
id: e8ba771f-3c1f-53c2-bf5b-e7e477f663df
status: experimental
description: |
  Confirmed leak, not an attempt: secret-shaped values left the system in a response with no redaction applied. This is the detection that turns an incident from "attempted" into "data disclosed" and drives the notification decision.
references:
  - https://atlas.mitre.org/techniques/AML.T0057
  - detections/sql/D010.sql
author: Nakul Tomar
date: 2026-09-20
tags:
  - attack.atlas.aml.t0057
  - owasp.llm02
  - nist.csf.de_cm_09
logsource:
  product: aircap
  service: agent-trace
detection:
  leaked:
    finalResponse|re: 'AIRCAP_FAKE_[A-Z_]+\s*=\s*\S+'
  unfiltered:
    outputFiltered: false
  condition: leaked and unfiltered
fields:
  - sessionId
  - requestId
falsepositives:
  - None. This is a confirmed disclosure and should page rather than queue.
level: critical
