title: Credential material present in a model prompt
id: 1ec9f5e9-bb52-5846-b531-ec07d461dcf9
status: experimental
description: |
  Secret-shaped strings reached the model's input. In an agent loop this is usually tool output being fed back into context, meaning data has already left its store and is now inside an inference request.
references:
  - https://atlas.mitre.org/techniques/AML.T0057
  - detections/sql/D002.sql
author: Nakul Tomar
date: 2026-09-20
tags:
  - attack.atlas.aml.t0057
  - owasp.llm02
  - nist.csf.de_cm_09
logsource:
  product: aircap
  service: bedrock-invocation
detection:
  keywords:
    - 'AIRCAP_FAKE_'
  aws_keys:
    input.inputBodyJson.prompt|re: '(AKIA|ASIA)[0-9A-Z]{16}'
  condition: keywords or aws_keys
fields:
  - requestId
  - identity.arn
falsepositives:
  - Documentation or test fixtures that legitimately contain example key formats.
    Exclude known fixture paths rather than weakening the pattern.
level: high
