<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>AIRCAP Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
<style>
:root{
  --bg:#0c0f14; --bg-2:#11151d; --bg-3:#161b26; --bg-hover:#1b2130;
  --line:#232b3a; --line-2:#2f3a4d;
  --fg:#e6ebf4; --fg-2:#9aa8bf; --fg-3:#67748c;
  --accent:#4f9dff; --accent-dim:#16304f;
  --crit:#ff5f56; --high:#ff9f43; --med:#ffd93d; --low:#4fd1c5; --ok:#36d399;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --r:8px; --shadow:0 8px 24px rgba(0,0,0,.4);
}
html[data-theme="light"]{
  --bg:#f6f8fb; --bg-2:#fff; --bg-3:#eef2f7; --bg-hover:#e6ecf4;
  --line:#dde4ee; --line-2:#c6d1e0;
  --fg:#111823; --fg-2:#4d5b73; --fg-3:#7a88a0;
  --accent:#0b62d6; --accent-dim:#dbe9ff;
  --crit:#d92d20; --high:#d97706; --med:#b59000; --low:#0d9488; --ok:#067647;
  --shadow:0 8px 24px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:15px;letter-spacing:.14em;font-weight:700}
.brand p{margin:4px 0 0;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
nav{padding:10px 8px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;margin-bottom:2px;background:none;border:0;border-radius:var(--r);color:var(--fg-2);cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:var(--bg-hover);color:var(--fg)}
nav button[aria-current="true"]{background:var(--accent-dim);color:var(--fg);font-weight:600}
nav button .ico{width:16px;text-align:center;flex:0 0 16px;opacity:.85}
nav button .badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.sidefoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:6px}
main{padding:22px 26px 60px;max-width:1500px;overflow:hidden}

/* ---------- header ---------- */
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.head p{margin:5px 0 0;color:var(--fg-2);max-width:74ch}
.head .spacer{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{padding:7px 13px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-3);color:var(--fg);cursor:pointer;font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--bg-hover);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.danger:hover:not(:disabled){background:var(--crit);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);cursor:pointer;user-select:none;font-size:13px}
.chk input{accent-color:var(--accent);cursor:pointer}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);font-weight:650}
.card .big{font-size:26px;font-weight:680;font-family:var(--mono);letter-spacing:-.02em}
.card .sub{font-size:12px;color:var(--fg-2);margin-top:3px}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.panel>header{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--bg-3)}
.panel>header h3{margin:0;font-size:13px;font-weight:650}
.panel>header .spacer{flex:1}
.panel .body{padding:15px}
.panel .body.flush{padding:0}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;background:var(--bg-3);color:var(--fg-3);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg-hover)}
td.mono,th.mono,.mono{font-family:var(--mono);font-size:12px}
td.num{text-align:right;font-family:var(--mono)}
td.wrap{white-space:normal;min-width:240px}
.clickable{cursor:pointer}

/* ---------- pills ---------- */
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:650;font-family:var(--mono);border:1px solid transparent;white-space:nowrap}
.pill.critical{color:var(--crit);border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.pill.high{color:var(--high);border-color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}
.pill.medium{color:var(--med);border-color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent)}
.pill.low{color:var(--low);border-color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.muted{color:var(--fg-3);border-color:var(--line-2)}
.pill.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}

/* ---------- matrix ---------- */
.matrix{border-collapse:separate;border-spacing:3px}
.matrix th{background:none;position:static;border:0;padding:4px;font-size:10px;color:var(--fg-3)}
.matrix th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:58px;font-family:var(--mono)}
.matrix td{border:0;padding:0}
.matrix td.rowhead{font-family:var(--mono);font-size:12px;padding-right:10px;white-space:nowrap;color:var(--fg-2)}
.cell{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);border:1px solid var(--line)}
.cell.hit_expected{background:color-mix(in srgb,var(--ok) 26%,transparent);border-color:var(--ok);color:var(--ok)}
.cell.hit_unexpected{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent);color:var(--accent)}
.cell.missed{background:color-mix(in srgb,var(--crit) 26%,transparent);border-color:var(--crit);color:var(--crit)}
.cell.none{background:var(--bg-3);color:var(--fg-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--fg-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- misc ---------- */
.note{background:var(--bg-3);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:11px 14px;color:var(--fg-2);font-size:13px;margin-bottom:14px}
.note.warn{border-left-color:var(--high)}
.note.crit{border-left-color:var(--crit)}
.note strong{color:var(--fg)}
.empty{padding:40px 20px;text-align:center;color:var(--fg-3)}
.empty p{margin:0 0 12px}
pre{margin:0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
.scroll{max-height:440px;overflow:auto}
textarea{width:100%;min-height:96px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);color:var(--fg);font-family:var(--mono);font-size:13px;padding:11px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--fg-3);font-family:var(--mono);font-size:12px;white-space:nowrap}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:14px;align-items:start}
.list{max-height:520px;overflow:auto}
.list button{display:block;width:100%;text-align:left;padding:10px 13px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);cursor:pointer}
.list button:hover{background:var(--bg-hover)}
.list button[aria-current="true"]{background:var(--accent-dim)}
.list .t{font-weight:600;font-size:13px}
.list .s{font-size:11px;color:var(--fg-3);font-family:var(--mono);margin-top:2px}

/* markdown */
.md h1{font-size:18px;margin:0 0 10px} .md h2{font-size:15px;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.md h3{font-size:13px;margin:16px 0 6px;color:var(--fg-2)}
.md table{margin:10px 0;font-size:12px} .md td,.md th{padding:6px 10px}
.md code{background:var(--bg-3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
.md blockquote{margin:10px 0;padding:9px 13px;border-left:3px solid var(--high);background:var(--bg-3);color:var(--fg-2)}
.md ul{margin:8px 0;padding-left:22px} .md li{margin:3px 0}
.md p{margin:8px 0} .md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md strong{color:var(--fg)}

/* toast + busy */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:440px}
.toast{background:var(--bg-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--r);padding:11px 14px;box-shadow:var(--shadow);font-size:13px;animation:slide .16s ease-out}
.toast.err{border-left-color:var(--crit)} .toast.good{border-left-color:var(--ok)}
.toast .th{font-weight:650;margin-bottom:2px}
.toast .tb{color:var(--fg-2);font-size:12px}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#busy{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);display:none;place-items:center;z-index:70;backdrop-filter:blur(2px)}
#busy.on{display:grid}
#busy .box{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r);padding:22px 30px;box-shadow:var(--shadow);text-align:center}
.spin{width:26px;height:26px;margin:0 auto 12px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}
@media(max-width:980px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>AIRCAP</h1>
      <p>AI incident response</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="btn sm" id="theme" title="Toggle theme">◐ Theme</button>
      <button class="btn sm danger" id="reset" title="Clear telemetry, incidents, containment and corpus pollution">Reset lab</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="busy"><div class="box"><div class="spin"></div><div id="busytext">Working…</div></div></div>
<div id="toasts"></div>
<script src="/static/console.js"></script>
</body>
</html>
