{
  "_comment": [
    "AIRCAP shadow-AI osquery pack. Install to /etc/osquery/packs/ai-shadow.conf and",
    "reference it from osquery.conf, or run one-off with:",
    "  osqueryi --json \"$(jq -r '.queries.ai_local_runtime_processes.query' ai-shadow.conf)\"",
    "",
    "Intervals are deliberately long. Shadow AI is a governance signal, not an intrusion",
    "signal: a 5-minute gap costs nothing, and hammering these tables on a laptop fleet",
    "is how endpoint agents get uninstalled by annoyed users."
  ],
  "platform": "linux,darwin,windows",
  "queries": {
    "ai_local_runtime_processes": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, u.username, p.start_time FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE LOWER(p.name) IN ('ollama','llama-server','llama-cli','lmstudio','vllm','gpt4all','local-ai','localai','koboldcpp','jan');",
      "interval": 300,
      "description": "Locally-running LLM inference runtimes. Local inference keeps prompts off the network, which means a network-only DLP stack cannot see it at all.",
      "value": "Shadow AI runtime inventory"
    },
    "ai_local_model_apis_listening": {
      "query": "SELECT DISTINCT l.pid, p.name, l.address, l.port, l.protocol FROM listening_ports l JOIN processes p USING (pid) WHERE l.port IN (11434,1234,8000,8080,1337,5001) AND l.address NOT IN ('', '::1');",
      "interval": 300,
      "description": "Model APIs bound to a port. Ollama's API on 11434 has no authentication by default, so a non-loopback bind is an unauthenticated inference endpoint on the network.",
      "value": "Unauthenticated local model API exposure"
    },
    "ai_browser_extensions_chromium": {
      "query": "SELECT ce.uid, u.username, ce.name, ce.identifier, ce.version, ce.path, ce.permissions FROM chrome_extensions ce LEFT JOIN users u ON ce.uid = u.uid WHERE ce.identifier IN ('gejiddespcgzlpaeadmiahhdikhmdcbi','bhlfhihanmpdkkjfmnhpfbgmmnbnhjhd','ekbbplmjjgoobkdmeeaicneljinnpmmi','jgjaeacdkonaoafenlfkkkmbaopkbilf','cbgecfllfhmmnknmamkejadjmnmpfjmp');",
      "interval": 3600,
      "description": "Known AI browser extensions by stable extension id. Ids are used rather than names because display names are user- and publisher-controllable.",
      "value": "Browser-based shadow AI"
    },
    "ai_browser_extensions_broad_permissions": {
      "query": "SELECT ce.name, ce.identifier, ce.permissions FROM chrome_extensions ce WHERE ce.permissions LIKE '%<all_urls>%' OR ce.permissions LIKE '%clipboardRead%';",
      "interval": 3600,
      "description": "Any extension able to read every page or the clipboard. This is the capability that turns an AI assistant extension into an exfiltration path, independent of which product it is.",
      "value": "Extension capability risk, product-agnostic"
    },
    "ai_model_weights_on_disk": {
      "query": "SELECT path, filename, size, mtime FROM file WHERE (path LIKE '/home/%/.ollama/models/blobs/%' OR path LIKE '/home/%/.cache/lm-studio/models/%%' OR path LIKE '/home/%/.cache/huggingface/hub/%%') AND size > 100000000;",
      "interval": 3600,
      "description": "Downloaded model weights over 100MB. Evidence of local inference even when the runtime is not currently running.",
      "value": "Dormant shadow AI"
    },
    "ai_pip_packages": {
      "query": "SELECT name, version, path FROM python_packages WHERE LOWER(name) IN ('openai','anthropic','google-generativeai','mistralai','cohere','litellm','langchain','llama-index','transformers','vllm','ollama','mcp');",
      "interval": 3600,
      "description": "AI SDKs installed system- or user-wide. Indicates a developer building against a model API, which is where unreviewed prompt handling and key storage tend to appear.",
      "value": "Developer-side AI dependency inventory"
    }
  }
}
