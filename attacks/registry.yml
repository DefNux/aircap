- id: A10
  name: Unauthorized principal invoking the model
  description: Stolen or over-broad credentials call the model directly, bypassing the application entirely
    - no guardrail attached, no agent trace, only control-plane evidence. This is the AI-specific face
    of ordinary IAM compromise.
  posture: {}
  atlas:
  - AML.T0044
  owasp:
  - LLM03:2026 Supply Chain
  expect_detections:
  - D003
  - D004
  notes: 'Prevention belongs to IAM policy, SCPs and mandatory-guardrail conditions - none of which exist
    in this lab. Excluded from the app-layer control test by design; the cloud mapping in Week 5 is where
    this one is actually answered. Emitted directly through the telemetry sink rather than the app, because
    the lab has no IAM plane to compromise. The record shape is what a real CloudTrail data event would
    show, and it is the only attack here with no agent-plane trace at all - which is itself the lesson:
    agent observability alone would miss this entirely.'
