- id: A08
  name: Token-flood cost denial of service
  description: Two phases. First a single oversized prompt, which the ceiling rejects. Then a burst of
    prompts sized just under the ceiling, which the ceiling permits - the economic attack is volume, not
    any individual request.
  posture: {}
  atlas:
  - AML.T0034
  owasp:
  - LLM10:2026 Unbounded Consumption
  expect_detections:
  - D001
  - D012
  notes: 'RESIDUAL RISK: the baseline has a per-prompt size ceiling but NO rate or volume limit, so a
    burst of individually-legitimate prompts is accepted in every posture. Detection (D012) only. Prevention
    needs per-principal token budgets. Phase 2 is the interesting half: every request is individually
    legitimate, so only a rate-and-volume detection sees it. Runs against the stub backend to keep it
    free.'
